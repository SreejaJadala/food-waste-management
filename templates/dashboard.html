{% load static %}
<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Food Waste Management</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav>
    <a href="/">Dashboard</a>
    <a href="/food/">Food waste</a>
    <a href="/analytics/">Analytics</a>
    <button id="logout">Logout</button>
</nav>
<main>
    <h1>Smart Food Waste Management & Analytics System</h1>
<!--    <p id="welcome">Loading your dashboard…</p>-->
    <section class="cards">
        <article>
            <small>Total prepared</small>
            <strong id="prepared">0 kg</strong>
        </article>
        <article>
            <small>Total wasted</small>
            <strong id="wasted">0 kg</strong>
        </article>
        <article>
            <small>Waste percentage</small>
            <strong id="percentage">0%</strong>
        </article>
        <article>
            <small>Available donations</small>
            <strong id="donations">0</strong>
        </article>
    </section>
    <section class="panel">
        <h2>Recent waste records</h2>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Source</th>
                <th>Food</th>
                <th>Prepared</th>
                <th>Wasted</th>
            </tr>
            </thead>
            <tbody id="recent"></tbody>
        </table>
    </section>
</main>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
