{% load static %}
<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Food Waste Records</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav>
    <a href="/">Dashboard</a>
    <a href="/food/">Food waste</a>
    <a href="/analytics/">Analytics</a>
    <button id="logout">Logout</button>
</nav>
<main>
    <h1>Food waste records</h1>
    <section class="panel">
        <h2>Add a record</h2>
        <form id="waste-form" class="form-grid">
            <input name="source" placeholder="Source (e.g. Main Canteen)" required>
            <input name="food_type" placeholder="Food type" required>
            <input name="prepared_quantity" type="number" min="0" step="0.1" placeholder="Prepared kg" required>
            <input name="wasted_quantity" type="number" min="0" step="0.1" placeholder="Wasted kg" required>
            <input name="date" type="date" required>
            <button>Add record</button>
        </form><p id="form-message">

    </p>
    </section>
    <section class="panel">
        <h2>Your records</h2>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Source</th>
                <th>Food</th>
                <th>Prepared</th>
                <th>Wasted</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="waste-list"></tbody>
        </table>
    </section>
</main>
<script src="{% static 'js/script.js' %}">

</script>
</body>
</html>
